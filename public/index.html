<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Hustle Empire</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <section id="auth" class="auth-screen">
    <div class="auth-card">
      <div class="logo">HUSTLE EMPIRE</div>
      <div class="tagline">Build. Upgrade. Rebirth. Dominate.</div>

      <div class="auth-tabs">
        <button id="registerTab" class="active" type="button">
          Create Account
        </button>

        <button id="loginTab" type="button">
          Log In
        </button>
      </div>

      <div class="field">
        <label for="u">Username</label>
        <input
          id="u"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          maxlength="24"
          placeholder="Enter username"
        >
      </div>

      <div class="field">
        <label for="p">Password</label>
        <input
          id="p"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Enter password"
        >
      </div>

      <button id="authButton" class="primary-btn" type="button">
        Create Account
      </button>

      <div id="msg" class="message"></div>

      <div class="auth-help">
        Username: 3–24 characters, letters, numbers, or _
        <br>
        Password: at least 8 characters
      </div>
    </div>
  </section>

  <section id="game" style="display:none;">
    <header class="game-header">
      <div>
        <div class="logo">HUSTLE EMPIRE</div>
        <div id="playerName"></div>
      </div>

      <button id="logoutButton" type="button">
        Log Out
      </button>
    </header>

    <main id="gameContent">
      <div class="game-card">
        <h2>Your Empire</h2>

        <div class="stats">
          <div>
            <span>Cash</span>
            <strong id="cash">$500.00</strong>
          </div>

          <div>
            <span>Lifetime Cash</span>
            <strong id="lifetimeCash">$500.00</strong>
          </div>

          <div>
            <span>Rebirths</span>
            <strong id="rebirths">0</strong>
          </div>
        </div>

        <button id="workButton" class="primary-btn" type="button">
          Hustle
        </button>

        <div id="gameMsg" class="message"></div>
      </div>
    </main>
  </section>

  <script src="/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const registerTab = document.getElementById("registerTab");
      const loginTab = document.getElementById("loginTab");
      const authButton = document.getElementById("authButton");

      function setMode(mode) {
        const isLogin = mode === "login";

        registerTab.classList.toggle("active", !isLogin);
        loginTab.classList.toggle("active", isLogin);

        authButton.textContent = isLogin
          ? "Log In"
          : "Create Account";

        authButton.onclick = isLogin
          ? window.login
          : window.register;

        const password = document.getElementById("p");

        password.autocomplete = isLogin
          ? "current-password"
          : "new-password";

        document.getElementById("msg").textContent = "";
      }

      registerTab.addEventListener("click", function () {
        setMode("register");
      });

      loginTab.addEventListener("click", function () {
        setMode("login");
      });

      document.getElementById("logoutButton").addEventListener("click", function () {
        if (typeof window.logout === "function") {
          window.logout();
        }
      });

      setMode("register");
    });
  </script>

</body>
</html>
