<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hustle Empire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="auth" class="auth-screen">
    <div class="auth-card">
      <div class="logo">HUSTLE EMPIRE</div>
      <div class="tagline">Build. Upgrade. Rebirth. Dominate.</div>
      <div class="auth-help">
        Username: 3–24 characters, letters, numbers, or _
        <br>
        Password: at least 8 characters
      </div>
      <div class="auth-tabs">
        <button id="registerTab" class="active" onclick="setMode('register')">
          Create Account
        </button>
        <button id="loginTab" onclick="setMode('login')">
          Log In
        </button>
      </div>
      <div class="field">
        <label for="u">Username</label>
        <input
          id="u"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          maxlength="24"
          placeholder="Enter username"
        >
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input
          id="p"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Enter password"
        >
      </div>
      <button id="authButton" class="primary-btn" onclick="register()">
        Create Account
      </button>
      <div id="msg" class="message"></div>
    </div>
  </section>
  <main id="game" class="game-screen hidden">
    <header class="topbar">
      <div>
        <div class="logo small">HUSTLE EMPIRE</div>
        <div id="playerName"></div>
      </div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </header>
    <section class="stats-grid">
      <div class="stat-card">
        <span>Cash</span>
        <strong id="cash">$0</strong>
      </div>
      <div class="stat-card">
        <span>Level</span>
        <strong id="level">1</strong>
      </div>
      <div class="stat-card">
        <span>Rebirths</span>
        <strong id="rebirths">0</strong>
      </div>
      <div class="stat-card">
        <span>Lifetime Cash</span>
        <strong id="lifetimeCash">$0</strong>
      </div>
    </section>
    <section class="game-card">
      <h2>Empire</h2>
      <p>Build your empire and grow your fortune.</p>
      <button class="primary-btn" onclick="work()">
        Hustle for Cash
      </button>
      <button class="secondary-btn" onclick="upgrade()">
        Upgrade Empire
      </button>
      <button class="danger-btn" onclick="rebirth()">
        Rebirth
      </button>
      <div id="gameMsg" class="message"></div>
    </section>
    <section class="game-card">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </section>
  </main>
  <script>
    function setMode(mode) {
      const registerTab = document.getElementById("registerTab");
      const loginTab = document.getElementById("loginTab");
      const authButton = document.getElementById("authButton");
      const password = document.getElementById("p");
      if (mode === "login") {
        registerTab.classList.remove("active");
        loginTab.classList.add("active");
        authButton.textContent = "Log In";
        authButton.onclick = login;
        password.setAttribute("autocomplete", "current-password");
      } else {
        loginTab.classList.remove("active");
        registerTab.classList.add("active");
        authButton.textContent = "Create Account";
        authButton.onclick = register;
        password.setAttribute("autocomplete", "new-password");
      }
      document.getElementById("msg").textContent = "";
    }
    function logout() {
      localStorage.removeItem("hustle_token");
      localStorage.removeItem("hustle_user");
      location.reload();
    }
    const originalRender = window.render;
    window.addEventListener("load", () => {
      setMode("register");
      if (typeof window.render === "function") {
        window.render();
      }
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
